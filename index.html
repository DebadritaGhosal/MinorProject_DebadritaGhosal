<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="weather-dashboard">
        <h1>Weather Dashboard</h1>
        <div class="search-section">
            <input type="text" id="city-input" placeholder="Enter city name">
            <button id="search-btn">Search</button>
            <button id="location-btn">Use My Location</button>
            <div class="unit-toggle">
                <label><input type="radio" name="unit" value="metric" checked>°C</label>
                <label><input type="radio" name="unit" value="imperial">°F</label>
            </div>
        </div>
        <div id="history-section"></div>
        <div id="error-message" class="hidden"></div>
        <div id="current-weather-section"></div>
        <button id="theme-toggle">Switch Theme</button>
        <div id="forecast-section">
            <h2>5-Day Forecast</h2>
            <div id="forecast-cards"></div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
